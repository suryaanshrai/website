# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: suryaansh.dev
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: suryaansh.dev
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header:
        name: Instrument Serif
        weights: [400]
        includeItalic: true
      body:
        name: Space Grotesk
        weights: [300, 400, 500, 600, 700]
      code:
        name: JetBrains Mono
        weights: [400, 500]
    colors:
      lightMode:
        light: "#ece1c8"
        lightgray: rgba(43, 32, 19, 0.16)
        gray: "#7d6f52"
        darkgray: "#6b5c45"
        dark: "#2b2013"
        secondary: "#7a2f24"
        tertiary: "#3f6b64"
        highlight: rgba(122, 47, 36, 0.1)
        textHighlight: rgba(63, 107, 100, 0.2)
      darkMode:
        light: "#08060e"
        lightgray: rgba(196, 178, 235, 0.14)
        gray: "#6b6383"
        darkgray: "#a79dbe"
        dark: "#efeaf7"
        secondary: "#b58cf0"
        tertiary: "#56c4d8"
        highlight: rgba(196, 178, 235, 0.14)
        textHighlight: rgba(86, 196, 216, 0.3)
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  # Left, not right: in the approved design the article page reads
  # CONTENTS | article | LINKED FROM + LOCAL GRAPH, so the table of contents is
  # the left rail and the right one is backlinks + graph.
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: left
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  # Disabled: this plugin does NOT read `configuration.theme.typography`
  # above — it has its own independent font system that (with no `options`
  # given) falls back to reading @quartz-themes/core's font registry, or,
  # failing that, hardcoded defaults (Schibsted Grotesk / Source Sans Pro /
  # IBM Plex Mono) — silently overriding --titleFont/--bodyFont/--codeFont
  # site-wide with the wrong fonts regardless of our real typography config.
  # The core Quartz engine (quartz/util/theme.ts) already generates the
  # correct fonts/CSS vars from `configuration.theme.typography` on its own;
  # this marketplace plugin is only needed for per-heading (h1-h6) font
  # overrides, which we don't use.
  - source: "@quartz-community/quartz-fonts"
    enabled: false
  # Disabled: this installs a full third-party Obsidian community theme's CSS
  # (with `theme: default` that's Obsidian's own stock theme) as competing
  # cascade layers that are declared AFTER `quartz-base` and therefore always
  # win regardless of specificity — it was silently overriding every color
  # variable (--light/--dark/--secondary/--gray) set by the real theme below
  # with generic Obsidian defaults, site-wide. Our actual color/typography
  # system is `configuration.theme` above; this plugin is not needed.
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  # Disabled: the approved design has no file-tree rail anywhere — not on
  # desktop, and not inside the mobile drawer, which lists the seven sections in
  # display serif and nothing else. The explorer was the single most "generic
  # Quartz" element on the page: a bordered panel of emoji folder rows that
  # stacked a second sticky bar above the real header on mobile and ate 320px of
  # the reading width on desktop. Navigation is the top rail plus search.
  - source: "@quartz-community/explorer"
    enabled: false
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  # Rendered explicitly in the site header (see quartz.ts HEADER) instead of
  # the plugin's own default left-sidebar placement — disabled here so it
  # isn't instantiated twice (the marketplace loader still installs it;
  # `enabled: false` only skips its automatic layout placement).
  - source: "@quartz-community/search"
    enabled: false
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # Disabled: this renders "suryaansh.dev" a second time at the top of the left
  # rail. The wordmark lives in the top rail (SiteHeader), exactly once.
  - source: "@quartz-community/page-title"
    enabled: false
    layout:
      position: left
      priority: 10
  # darkmode and reader-mode are rendered explicitly in the site header
  # (see quartz.ts HEADER) on every page type instead of via the plugin's
  # own default left-sidebar placement — same reasoning as search above.
  - source: "@quartz-community/darkmode"
    enabled: false
  - source: "@quartz-community/reader-mode"
    enabled: false
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: false
    options:
      links: {}
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  # Disabled with the explorer: this only existed to pad the mobile left-sidebar
  # toolbar, which no longer renders.
  - source: "@quartz-community/spacer"
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  # This plugin is what strips the YAML frontmatter block out of the rendered
  # body, so it must stay enabled — disabling it dumps `title:/description:/
  # tags:` into the top of every post and into the meta description. What is not
  # wanted is its Obsidian-style "Properties" table, which showed an almost
  # always empty `description —` row plus the tags that are already rendered as
  # pills immediately below it, so every post listed its tags twice. The
  # approved design has no properties table: keep the parsing, drop the view.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    # Index pages are a full-width editorial list in the design — no rails on
    # either side. `left: []` matters now that the table of contents lives there;
    # a folder page has no headings, so the rail would render as an empty gutter.
    folder:
      exclude:
        - reader-mode
      positions:
        left: []
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        left: []
        right: []
    canvas: {}
    bases: {}
